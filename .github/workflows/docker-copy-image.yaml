name: "Docker Copy Image"

on:
  workflow_dispatch:

jobs:
  copy_image:
    name: "Generate Docker image tag"
    runs-on: ubuntu-latest
    env:
      IMAGE_SRC: "nextcloud:32.0.6"
      IMAGE_DST: "ghcr.io/david-lor/nextcloud:32.0.6"
    steps:
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Pull image"
        run: "docker pull ${{ env.IMAGE_SRC }}"
      - name: "Tag image"
        run: "docker image tag ${{ env.IMAGE_SRC}} ${{ env.IMAGE_DST }}"
      - name: "Push image"
        run: "docker push ${{ env.IMAGE_DST }}"
